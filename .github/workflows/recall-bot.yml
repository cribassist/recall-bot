name: Recall Bot

on:
  schedule:
    # Runs at minute 0 past every 6th hour (UTC). Adjust as you like.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state file

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run recall bot
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python recall_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "recall-bot"
          git config user.email "actions@github.com"
          git add post_state.json
          git diff --staged --quiet || git commit -m "Update posted recall state [skip ci]"
          git push
